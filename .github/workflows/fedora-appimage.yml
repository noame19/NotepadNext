name: Build AppImage (Fedora container)

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]

# Tell AppImage launchers (linuxdeploy etc.) to extract-and-run, since the
# container doesn't have a working FUSE for end-users to mount AppImages.
env:
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build:
    name: Build on Fedora 42
    runs-on: ubuntu-24.04
    container:
      image: fedora:42

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install build dependencies (Fedora 42)
        run: |
          set -eux
          dnf -y install --setopt=install_weak_deps=False \
            cmake ninja-build gcc-c++ \
            qt6-qtbase-devel qt6-qtwayland-devel \
            desktop-file-utils \
            wget file \
            libxkbcommon-devel libxkbcommon-x11 \
            cups-devel \
            git

      - name: Show toolchain
        run: |
          set -eux
          cat /etc/os-release | head -4
          cmake --version | head -1
          ninja --version
          echo "qmake6: $(which qmake6)"
          qmake6 -v

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_DISTRIBUTION=AppImage

      - name: Build
        run: cmake --build build --parallel

      - name: Build AppImage target
        run: cmake --build build --target appimage --parallel

      - name: Inspect AppImage
        run: |
          set -eux
          ls -la build/*.AppImage
          file build/*.AppImage
          sha256sum build/*.AppImage

      - name: Rename AppImage
        run: |
          set -eux
          mkdir -p dist
          mv build/NotepadNext-*.AppImage \
            "dist/NotepadNext-master-${GITHUB_SHA::7}-fedora42-x86_64.AppImage"
          ls -la dist/
          file dist/*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: NotepadNext-Linux-Fedora42-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Attach AppImage to GitHub release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: NotepadNext-Linux-Fedora42-AppImage
          path: dist

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release upload "${{ github.ref_name }}" \
            dist/*.AppImage \
            --repo "${{ github.repository }}" \
            --clobber
