name: Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build AppImage (Linux)
    runs-on: ubuntu-24.04

    env:
      QT_VERSION: '6.5.3'
      # AppImage 启动器检测到这个变量后会自己解压运行，绕开 FUSE 限制
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Qt ${{ env.QT_VERSION }} SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: 'qt5compat'
          cache: true

      - name: Install Linux build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor-dev libcups2-dev fuse \
            file
          # 提供 libwayland-client.so 等基础库，让 AppImage 内部能 link 到
          sudo apt-get install -y \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libwayland-server0 libdbus-1-3
          # 提供 fcitx5 Qt6 平台输入法插件和运行库
          # 不打包进 AppImage 的话，Qt 6 wayland 会 fallback 到 QWaylandInputContext，
          # 走 wayland input-method-v3 协议，text_input_rect 报告有问题导致
          # fcitx5 候选词 UI 跑到屏幕底部（不贴光标）。
          # 有了这个插件，Qt 走 DBus 协议跟 fcitx5 通信，候选词位置准确。
          # Ubuntu 包名是 fcitx5-frontend-qt6，不是 fcitx5-qt6。
          # 装的库：
          #   libfcitx5-qt6-1   — libfcitx5-qt6widgets.so / libfcitx5-qt6dbus.so
          #   libfcitx5utils2   — libFcitx5Utils.so
          #   libfcitx5-qt-data — IM module 的 Qt 资源文件（不一定需要）
          sudo apt-get install -y \
            fcitx5-frontend-qt6 libfcitx5-qt6-1 libfcitx5utils2 libfcitx5-qt-data

      # 设置 EXTRA_PLATFORM_PLUGINS 让 linuxdeploy-plugin-qt 打包 Qt wayland 平台插件。
      # Qt 6.5 用 libqwayland-generic.so（Qt 6.10+ 改名为 libqwayland.so）。
      # 没这个 AppImage 只能走 XWayland，跟 KDE Plasma + fcitx5 的 wayland input-method-v2
      # 协议不兼容，中文输入法失效。
      - name: Setup Linux AppImage
        run: |
          set -eux
          echo "EXTRA_PLATFORM_PLUGINS=libqwayland-generic.so" >> "$GITHUB_ENV"
          # EXTRA_QT_MODULES 让 linuxdeploy-plugin-qt 打包更多 Qt 模块
          echo "EXTRA_QT_MODULES=qt5compat" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          set -eux
          cmake --version | head -1
          ninja --version
          echo "qmake6: $(which qmake6)"
          qmake6 -v

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_DISTRIBUTION=AppImage

      - name: Build
        run: cmake --build build --parallel

      # 把 fcitx5 Qt6 平台输入法插件和运行库复制到 AppDir。
      # 这样 Qt 在 AppImage 启动时能找到 libfcitx5platforminputcontextplugin.so，
      # 优先用 DBus 协议跟 fcitx5 通信（候选词位置准确），而不是 fallback 到
      # Qt 内置的 QWaylandInputContext（走 wayland input-method-v3，候选词位置
      # 在 KDE Plasma 下经常跑到屏幕底部）。
      - name: Inject fcitx5 Qt6 plugin into AppDir
        run: |
          set -eux
          APPDIR=build/AppDir
          mkdir -p "$APPDIR/usr/plugins/platforminputcontexts"
          # Qt fcitx5 platforminputcontext 插件
          cp -v /usr/lib/x86_64-linux-gnu/qt6/plugins/platforminputcontexts/libfcitx5platforminputcontextplugin.so \
             "$APPDIR/usr/plugins/platforminputcontexts/"
          # fcitx5 Qt6 运行时库（被 plugin 动态加载）
          cp -v /usr/lib/x86_64-linux-gnu/libFcitx5Utils.so.0* "$APPDIR/usr/lib/" || true
          cp -v /usr/lib/x86_64-linux-gnu/libFcitx5Core.so.0* "$APPDIR/usr/lib/" || true
          cp -v /usr/lib/x86_64-linux-gnu/libfcitx5utils.so.0* "$APPDIR/usr/lib/" || true
          cp -v /usr/lib/x86_64-linux-gnu/libfcitx5-qt6widgets.so.0* "$APPDIR/usr/lib/" || true
          cp -v /usr/lib/x86_64-linux-gnu/libfcitx5-qt6dbus.so.0* "$APPDIR/usr/lib/" || true
          ls -la "$APPDIR/usr/plugins/platforminputcontexts/"
          ls -la "$APPDIR/usr/lib/" | grep -i fcitx || true

      - name: Build AppImage
        run: cmake --build build --target appimage --parallel

      - name: Inspect AppImage
        run: |
          set -eux
          ls -la build/*.AppImage
          file build/*.AppImage
          sha256sum build/*.AppImage

      - name: Rename AppImage
        run: |
          set -eux
          mkdir -p dist
          mv build/NotepadNext-*.AppImage \
            "dist/NotepadNext-${GITHUB_SHA::7}-linux-x86_64.AppImage"
          ls -la dist/
          file dist/*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: NotepadNext-Linux-Qt${{ env.QT_VERSION }}-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Attach AppImage to GitHub release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: NotepadNext-Linux-Qt6.8.3-AppImage
          path: dist

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release upload "${{ github.ref_name }}" \
            dist/*.AppImage \
            --repo "${{ github.repository }}" \
            --clobber
