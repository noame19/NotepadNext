name: Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build AppImage (Linux)
    runs-on: ubuntu-24.04

    env:
      QT_VERSION: '6.8'
      # AppImage 启动器检测到这个变量后会自己解压运行，绕开 FUSE 限制
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Qt ${{ env.QT_VERSION }} SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: 'qt5compat'
          cache: true

      - name: Install Linux build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor-dev libcups2-dev fuse \
            file

      - name: Show toolchain
        run: |
          set -eux
          cmake --version | head -1
          ninja --version
          echo "qmake6: $(which qmake6)"
          qmake6 -v

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_DISTRIBUTION=AppImage

      - name: Build
        run: cmake --build build --parallel

      - name: Build AppImage
        run: cmake --build build --target appimage --parallel

      - name: Inspect AppImage
        run: |
          set -eux
          ls -la build/*.AppImage
          file build/*.AppImage
          sha256sum build/*.AppImage

      - name: Rename AppImage
        run: |
          set -eux
          mkdir -p dist
          mv build/NotepadNext-*.AppImage \
            "dist/NotepadNext-${GITHUB_SHA::7}-linux-x86_64.AppImage"
          ls -la dist/
          file dist/*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: NotepadNext-Linux-Qt${{ env.QT_VERSION }}-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Attach AppImage to GitHub release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: NotepadNext-Linux-Qt6.8-AppImage
          path: dist

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release upload "${{ github.ref_name }}" \
            dist/*.AppImage \
            --repo "${{ github.repository }}" \
            --clobber
