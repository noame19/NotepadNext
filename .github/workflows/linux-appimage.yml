name: Linux AppImage

on:
  workflow_dispatch:
  #push:
  #  branches: [master]
  #  tags: ['*']
  #pull_request:
  #  branches: [master]

jobs:
  build:
    name: Build AppImage (Linux)
    runs-on: ubuntu-24.04

    env:
      QT_VERSION: '6.5.3'
      # AppImage 启动器检测到这个变量后会自己解压运行，绕开 FUSE 限制
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Qt ${{ env.QT_VERSION }} SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: 'qt5compat'
          cache: true

      - name: Install Linux build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor-dev libcups2-dev fuse \
            file
          # 提供 libwayland-client.so 等基础库，让 AppImage 内部能 link 到
          # Qt wayland 平台插件（libqwayland-generic.so）依赖这些。
          sudo apt-get install -y \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libwayland-server0 libdbus-1-3

      # 设置 EXTRA_PLATFORM_PLUGINS 让 linuxdeploy-plugin-qt 打包 Qt wayland 平台插件。
      # Qt 6.5/6.8 用 libqwayland-generic.so（Qt 6.10+ 改名为 libqwayland.so）。
      #
      # 不要注入 fcitx5 platforminputcontext 插件（libfcitx5platforminputcontextplugin.so）。
      # 那个插件让 Qt 走 DBus 而不是原生 wayland input-method-v2/v3 协议，
      # 它的 cursorRectangleWrapper() 对 QAbstractScrollArea 派生的 widget
      # （如 ScintillaEditBase）会算出错误的矩形，导致 fcitx5 候选词 UI
      # 跟光标位置差一大块。
      # 走原生 wayland 协议（QWaylandInputContext）是 KDE Plasma 下 fcitx5
      # 中文输入的正确做法，Kate / Dolphin / Konsole 都走这条路径。
      - name: Setup Linux AppImage
        run: |
          set -eux
          echo "EXTRA_PLATFORM_PLUGINS=libqwayland-generic.so" >> "$GITHUB_ENV"
          # EXTRA_QT_MODULES 让 linuxdeploy-plugin-qt 打包更多 Qt 模块
          echo "EXTRA_QT_MODULES=qt5compat" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          set -eux
          cmake --version | head -1
          ninja --version
          echo "qmake6: $(which qmake6)"
          qmake6 -v

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_DISTRIBUTION=AppImage

      - name: Build
        run: cmake --build build --parallel

      - name: Build AppImage
        run: cmake --build build --target appimage --parallel

      - name: Inspect AppImage
        run: |
          set -eux
          ls -la build/*.AppImage
          file build/*.AppImage
          sha256sum build/*.AppImage

      - name: Rename AppImage
        run: |
          set -eux
          mkdir -p dist
          mv build/NotepadNext-*.AppImage \
            "dist/NotepadNext-${GITHUB_SHA::7}-linux-x86_64.AppImage"
          ls -la dist/
          file dist/*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: NotepadNext-Linux-Qt${{ env.QT_VERSION }}-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Attach AppImage to GitHub release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: NotepadNext-Linux-Qt6.8.3-AppImage
          path: dist

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release upload "${{ github.ref_name }}" \
            dist/*.AppImage \
            --repo "${{ github.repository }}" \
            --clobber
